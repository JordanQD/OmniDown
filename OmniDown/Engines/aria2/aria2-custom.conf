###############################
# OmniDown custom-engine config file
#
# Compatible with both aria2 and aria2-next.
# Static defaults live here. Runtime values such as rpc port, secret,
# download directory, session path, and proxy are supplied as CLI args.
###############################

################ RPC ################
enable-rpc=true
rpc-allow-origin-all=false
rpc-listen-all=false

################ File system ################
auto-save-interval=0
disk-cache=64M
file-allocation=none
no-file-allocation-limit=64M
save-session-interval=10

################ Task ################
bt-detach-seed-only=true
check-certificate=false
max-file-not-found=10
max-tries=0
retry-wait=10
connect-timeout=10
timeout=10
min-split-size=1M
http-accept-gzip=true
remote-time=true
summary-interval=0
content-disposition-default-utf8=true

################ BT Task ################
bt-enable-lpd=true
bt-max-peers=128
dht-entry-point=dht.transmissionbt.com:6881
enable-dht=true
enable-peer-exchange=true
